["Te llega: “¡Ganaste un premio! Entrá a este link en 5 minutos”. ¿Qué hacés?","No hago clic, lo borro y aviso","Entro rápido para no perderlo","Se lo reenvío a mis contactos"],
["Una persona te pide la clave de tu juego para “ayudarte”. ¿Qué hacés?","No la comparto: mis claves son solo mías","Se la paso, total es de confianza","La escribo en un grupo para que la vean"]]},
{t:"Inteligencia Artificial y noticias falsas",e:"🤖",h:150,s:43,
c:[["La IA se equivoca","La Inteligencia Artificial (IA) escribe textos y crea imágenes muy convincentes, pero a veces inventa datos. Siempre comprobá lo que dice en otra fuente confiable."],

q:[["Te llega una imagen increíble de algo que nadie más muestra. ¿Qué hacés?","Busco en medios confiables antes de compartir","La comparto ya, es muy fuerte","Le creo, se ve muy real"],

{t:"Respeto y cuidado en las redes (ESI)",e:"💜",h:330,s:59,
c:[["Consentimiento","Consentir es decir “sí” porque querés, sin presión. Para sacar, mandar o compartir una foto tuya o de otra persona hace falta ese sí. Antes de compartir una foto de alguien, pedile permiso, y si te dice que no, ese “no” se respeta. Y cualquiera puede cambiar de idea."],
["Grooming","El grooming es cuando un adulto se hace pasar por alguien de tu edad o gana tu confianza para pedirte fotos o secretos. Si algo te incomoda: cortá, guardá capturas y contáselo a alguien de confianza."],

q:[["Alguien te pide una foto íntima y dice: “si me querés, me la mandás”. ¿Qué hacés?","Digo que no, bloqueo y se lo cuento a un adulto de confianza","Se la mando para no discutir","Le mando una más tapada"],

["En el grupo del curso se burlan de alguien por cómo es. ¿Qué hacés?","No sumo burlas, apoyo a esa persona y aviso a un adulto","Me río para no quedar afuera","Comparto el chiste en otros grupos"]]}];
/* Sonido */
let AC,mute=false;
function snd(f,d=.12,t="sine",v=.12,w=0){if(mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),a=AC.currentTime+w;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a);g.gain.exponentialRampToValueAtTime(.001,a+d);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+d)}
const seq=(n,d,t,v,s)=>n.forEach((f,i)=>snd(f,d,t,v,i*s));
const S={step:()=>snd(220,.04,"triangle",.05),coin:()=>{snd(988,.08,"square",.06);snd(1319,.2,"square",.06,.08)},card:()=>seq([523,659,784],.15,"sine",.12,.07),ok:()=>seq([523,659,784,1047],.2,"triangle",.14,.09),bad:()=>{snd(180,.25,"sawtooth",.08);snd(140,.3,"sawtooth",.08,.12)},door:()=>seq([392,523,659,784,1047],.25,"square",.06,.08),win:()=>seq([523,659,784,1047,784,1047,1319],.25,"triangle",.15,.13)};
const P=[523,659,784,659,587,740,880,740];let bi=0;setInterval(()=>snd(P[bi++%8]/2,.3,"triangle",.03),420);
$("mu").onclick=()=>{mute=!mute;$("mu").textContent=mute?"🔇":"🔊"};
/* Laberinto */
let lv=0,g,px,py,qx,qy,od=0,rep=0,sab=0,av="🦊",mod=false,seen={},inf,dr,dp,dj,cur,Lv,part=[];
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(s){const r=rng(s);g=Array.from({length:H},()=>Array(W).fill("#"));inf={};dr={};dp=[];
const st=[[1,1]];g[1][1]=".";
while(st.length){const[x,y]=st[st.length-1],ds=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>{const X=x+a,Y=y+b;return X>0&&Y>0&&X<W-1&&Y<H-1&&g[Y][X]=="#"});
if(!ds.length){st.pop();continue}const[a,b]=ds[Math.floor(r()*ds.length)];g[y+b/2][x+a/2]=".";g[y+b][x+a]=".";st.push([x+a,y+b])}
const par={"1,1":null},q=[[1,1]];let far;
while(q.length){const[x,y]=far=q.shift();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const k=(x+a)+","+(y+b);if(g[y+b][x+a]!="#"&&!(k in par)){par[k]=x+","+y;q.push([x+a,y+b])}})}
let k=far.join(","),Q=[];while(k){Q.unshift(k.split(",").map(Number));k=par[k]}
const n=Q.length,on=new Set(Q.map(String));g[far[1]][far[0]]="E";
F.forEach((f,j)=>{const i=Math.floor(n*f),[x,y]=Q[i],[a,b]=Q[i-4];g[y][x]="D";dr[x+","+y]=j;dp[j]=[x,y];g[b][a]="i";inf[a+","+b]=j});
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(g[y][x]=="."&&!(x==1&&y==1)){const nb=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>g[y+b][x+a]!="#").length,pi=Q.findIndex(p=>p[0]==x&&p[1]==y);
if(nb==1||(pi<0&&r()<.06)||(pi>=0&&pi%7==3))g[y][x]="c"}}
function init(){Lv=L[lv];gen(Lv.s);px=qx=1;py=qy=1;od=0;ui();size()}
function avs(){return AV.map(([e,n])=>`<button class="avb${e==av?" sel":""}" data-e="${e}" ${sab<n?"disabled":""} onclick="pick('${e}')">${sab<n?"🔒"+n:e}</button>`).join("")}
function pick(e){av=e;document.querySelectorAll(".avb").forEach(b=>b.classList.toggle("sel",b.dataset.e==e));S.coin()}
function ui(){$("lt").textContent=`Nivel ${lv+1} de 4 · ${Lv.t}`;$("st").innerHTML=`<span class="chip">🪙 Monedas ${rep}</span><span class="chip">🧠 Sabiduría ${sab}</span><span class="chip">🔒 Puertas ${od}/3</span>`;$("av").innerHTML=avs()}
function size(){const cs=Math.max(18,Math.floor(Math.min(innerWidth-28,720)/W));cv.width=W*cs;cv.height=H*cs;bake()}
function burst(x,y,c,n){const cs=cv.width/W;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*3;part.push({x:(x+.5)*cs,y:(y+.5)*cs,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,c})}}
const bg=document.createElement("canvas"),PL=["🌳","🌲","🌴","🌿","🌸","🌻"];
function leaf(c,x,y,l,a,col){c.save();c.translate(x,y);c.rotate(a);c.fillStyle=col;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(l*.5,-l*.32,l,0);c.quadraticCurveTo(l*.5,l*.32,0,0);c.fill();c.strokeStyle="rgba(255,255,255,.3)";c.lineWidth=1;c.beginPath();c.moveTo(0,0);c.lineTo(l*.9,0);c.stroke();c.restore()}
function bush(c,X,Y,s,x,y){let r=(x*73+y*151)%97+3;const R=()=>(r=(r*31+17)%101)/101,v=(x*7+y*3)%3,G=()=>`hsl(${100+R()*50} ${55+R()*15}% ${24+R()*22}%)`;
c.save();c.beginPath();c.roundRect(X,Y,s,s,s*.2);c.clip();c.fillStyle="hsl(145 45% 13%)";c.fillRect(X,Y,s,s);
for(let i=0;i<14;i++)leaf(c,X+s*(.2+.6*R()),Y+s*.95,s*(.45+.4*R()),-Math.PI/2+(R()-.5)*2.6,G());
if(v==1){c.lineWidth=1.5;for(let i=0;i<8;i++){const bx=X+s*(.1+.8*R());c.strokeStyle=G();c.beginPath();c.moveTo(bx,Y+s);c.quadraticCurveTo(bx+(R()-.5)*s*.4,Y+s*.5,bx+(R()-.5)*s*.5,Y+s*(.1+.3*R()));c.stroke()}}
if(v==2){const col=["#ff5fa2","#ffd23f","#ff8a3d","#c084fc"][(x+y)%4],fx=X+s*(.3+.4*R()),fy=Y+s*.3;c.strokeStyle="#2f7d32";c.lineWidth=2;c.beginPath();c.moveTo(fx,Y+s);c.lineTo(fx,fy);c.stroke();c.fillStyle=col;for(let k=0;k<5;k++){c.beginPath();c.ellipse(fx+Math.cos(k*1.2566)*s*.12,fy+Math.sin(k*1.2566)*s*.12,s*.09,s*.06,k*1.2566,0,7);c.fill()}c.fillStyle="#fff3a0";c.beginPath();c.arc(fx,fy,s*.06,0,7);c.fill()}
c.restore()}
function bushOld(c,X,Y,s,x,y){let r=(x*73+y*151)%97;const R=()=>(r=(r*31+17)%101)/101;
c.fillStyle="hsl(145 55% 16%)";c.beginPath();c.roundRect(X,Y,s,s,s*.25);c.fill();
for(let i=0;i<9;i++){const ax=X+s*(.15+.7*R()),ay=Y+s*(.15+.7*R()),rr=s*(.2+.12*R()),gr=c.createRadialGradient(ax-rr*.3,ay-rr*.35,rr*.1,ax,ay,rr);gr.addColorStop(0,`hsl(${95+R()*45} 60% ${42+R()*14}%)`);gr.addColorStop(1,`hsl(${135+R()*15} 60% 22%)`);c.fillStyle=gr;c.beginPath();c.arc(ax,ay,rr,0,7);c.fill()}
if(R()<.4)for(let i=0;i<3;i++){c.fillStyle=["#ff6bd6","#ffd23f","#fff"][(x+y+i)%3];c.beginPath();c.arc(X+s*(.2+.6*R()),Y+s*(.2+.6*R()),s*.06,0,7);c.fill()}}
function bake(){if(!g)return;const cs=cv.width/W,c=bg.getContext("2d"),h=Lv.h;bg.width=cv.width;bg.height=cv.height;c.textAlign="center";c.textBaseline="middle";
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const X=x*cs,Y=y*cs;c.fillStyle=`hsl(${h} 60% ${(x+y)%2?80:76}%)`;c.fillRect(X,Y,cs,cs);if(g[y][x]=="#")bush(c,X,Y,cs,x,y)}}
function draw(t){if(!g)return;const cs=cv.width/W,h=Lv.h;cx.textAlign="center";cx.textBaseline="middle";cx.drawImage(bg,0,0);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=g[y][x],X=x*cs,Y=y*cs,m=X+cs/2,n=Y+cs/2;
if(p=="#")continue;

if(p=="c"){cx.save();cx.translate(m,n);cx.scale(Math.abs(Math.cos(t*3+x+y))+.08,1);cx.fillStyle="#ffd23f";cx.strokeStyle="#c98a00";cx.lineWidth=2;cx.beginPath();cx.arc(0,0,cs*.3,0,7);cx.fill();cx.stroke();cx.fillStyle="#ffef9a";cx.beginPath();cx.arc(0,0,cs*.16,0,7);cx.fill();cx.restore()}
else if(p=="i"){cx.save();cx.translate(m,n);cx.rotate(Math.sin(t*3+x)*.18);cx.font=cs*.8+"px serif";cx.fillText("🚩",0,0);cx.restore()}
else if(p=="D"){cx.fillStyle=`hsl(${(h+180)%360} 85% ${50+8*Math.sin(t*5)}%)`;cx.beginPath();cx.roundRect(X+2,Y+2,cs-4,cs-4,6);cx.fill();cx.font=cs*.6+"px serif";cx.fillText("🔒",m,n)}
else if(p=="E"){cx.fillStyle="#2a1450";cx.beginPath();cx.arc(m,n,cs*.47,0,7);cx.fill();cx.shadowBlur=18;for(let k=0;k<3;k++){cx.strokeStyle=`hsl(${(t*140+k*70)%360} 95% 65%)`;cx.shadowColor=cx.strokeStyle;cx.lineWidth=3;cx.beginPath();cx.arc(m,n,cs*(.16+.12*k)+Math.sin(t*5+k)*2,0,7);cx.stroke()}cx.shadowBlur=0;cx.font=cs*.5+"px serif";cx.fillText("🌟",m,n)}}
qx+=(px-qx)*.3;qy+=(py-qy)*.3;const ux=(qx+.5)*cs,uy=(qy+.5)*cs;cx.fillStyle="rgba(0,0,0,.25)";cx.beginPath();cx.ellipse(ux,uy+cs*.38,cs*.3,cs*.1,0,0,7);cx.fill();cx.strokeStyle="#ffd23f";cx.lineWidth=3;cx.fillStyle="rgba(255,255,255,.7)";cx.beginPath();cx.arc(ux,uy,cs*(.48+.04*Math.sin(t*5)),0,7);cx.fill();cx.stroke();cx.font=cs*.9+"px serif";cx.fillText(av,ux,uy+Math.sin(t*6)*2);
part=part.filter(p=>p.l>0);part.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.l-=.025;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,5,5)});cx.globalAlpha=1}
function loop(t){draw(t/1000);requestAnimationFrame(loop)}
/* Ventanas */
function pop(h){$("bx").innerHTML=h;$("mo").hidden=false;mod=true}
function hide(){$("mo").hidden=true;mod=false}
function intro(first){pop(`<div class="big">${Lv.e}</div><h3>Nivel ${lv+1}: ${Lv.t}</h3><p>Encontrá la salida 🌟. En el camino hay 🚩 banderas con información, 🪙 monedas escondidas y 3 puertas 🔒 con desafíos.</p>`+(first?`<p>Para moverte: usá las flechas del teclado, los botones o deslizá el dedo por el laberinto. El sonido está activado 🔊.</p><p>Elegí tu animal:</p><div>${avs()}</div>`:"")+`<button onclick="go()">¡Jugar!</button>`)}
function go(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();hide()}
function card(j){const c=Lv.c[j];pop(`<div class="big">🚩</div><h3>${c[0]}</h3><p>${c[1]}</p><button onclick="hide()">¡Entendido!</button>`)}
function quiz(j){dj=j;const q=Lv.q[j];cur=q.slice(1).map((t,i)=>[t,!i]).sort(()=>Math.random()-.5);pop(`<div class="big">🔒</div><h3>Puerta ${j+1} de 3</h3><p>${q[0]}</p>`+cur.map((o,i)=>`<button class="o" onclick="ans(${i})">${o[0]}</button>`).join(""))}
function ans(i){if(cur[i][1]){sab+=20;od++;const[x,y]=dp[dj];g[y][x]=".";S.ok();setTimeout(S.door,350);burst(x,y,"#5eead4",26);
pop(`<div class="big">🎉</div><h3>¡Correcto! Puerta abierta</h3><p>${["¡Muy bien!","¡Vas genial!","¡Gran trabajo!"][dj]} Seguí por el camino.</p><button onclick="hide()">Seguir</button>`);ui()}
else{S.bad();const c=Lv.c[dj];pop(`<div class="big">🤔</div><h3>Casi… probá otra vez</h3><p>Equivocarse es parte de aprender. Leé este consejo y volvé a intentar:</p><p><b>${c[0]}:</b> ${c[1]}</p><button onclick="quiz(${dj})">Reintentar</button>`)}}
function end(){S.win();let n=0;const iv=setInterval(()=>{burst(Math.random()*W|0,Math.random()*H|0,["#ffd23f","#ff6bd6","#5eead4"][n%3],16);if(++n>16)clearInterval(iv)},150);
if(lv<3)pop(`<div class="big">🌟</div><h3>¡Encontraste la salida!</h3><p>💡 Consejo: ${TIPS[lv]}</p><button onclick="nxt()">Siguiente nivel ▶</button>`);
else{const m=sab>=300?"🥇 Medalla de oro":sab>=200?"🥈 Medalla de plata":"🥉 Medalla de bronce";
pop(`<div class="big">🏆</div><h3>¡Saliste del laberinto!</h3><p>${m}<br>🪙 ${rep} monedas · 🧠 ${sab} de sabiduría</p><p>💡 ${TIPS[3]}</p><p>Para charlar en clase:<br>• ¿Qué desafío te costó más?<br>• ¿Qué vas a cambiar en tus redes?<br>• ¿A quién le pedirías ayuda si algo te incomoda?</p><button onclick="rst()">Jugar de nuevo</button>`)}}
function nxt(){lv++;init();intro(false)}
function rst(){lv=0;rep=0;sab=0;seen={};init();intro(true)}
/* Movimiento */
function mv(dx,dy){if(mod||!g)return;const x=px+dx,y=py+dy,t=g[y][x];if(t=="#")return;
if(t=="D"){quiz(dr[x+","+y]);return}
px=x;py=y;S.step();
if(t=="c"){rep+=10;g[y][x]=".";S.coin();burst(x,y,"#ffd23f",10)}
if(t=="i"){const j=inf[x+","+y],id=lv+"."+j;if(!seen[id]){seen[id]=1;sab+=10}S.card();card(j)}
ui();if(t=="E")end()}
addEventListener("keydown",e=>{const d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];if(d){e.preventDefault();mv(...d)}});
let sx,sy;cv.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
cv.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)Math.abs(dx)>Math.abs(dy)?mv(Math.sign(dx),0):mv(0,Math.sign(dy))});
addEventListener("resize",size);
init();intro(true);requestAnimationFrame(loop);
</script></body></html>
